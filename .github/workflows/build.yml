name: Build APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_RELEASES_TOKEN: ${{ secrets.RELEASES_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4

      - name: Read version
        run: echo "VERSION=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts)" >> "$GITHUB_ENV"

      # Secrets are not available to pull requests from forks; the build then uses the debug key.
      - name: Set up release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode --ignore-garbage > "$RUNNER_TEMP/release.jks"
            echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "SIGNED=true" >> "$GITHUB_ENV"
          else
            echo "::warning::KEYSTORE_BASE64 secret missing - APK is signed with a throwaway debug key"
          fi

      - name: Run tests and build release APK
        env:
          SIGNING_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          # Once the RELEASES_TOKEN secret exists, the app looks for updates in the public
          # releases repo, so this source repo can be private.
          UPDATE_REPO: ${{ secrets.RELEASES_TOKEN != '' && 'FSosuke/persona-music-releases' || github.repository }}
        run: |
          ./gradlew --no-daemon testReleaseUnitTest assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "persona-music-$VERSION.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: persona-music-${{ env.VERSION }}
          path: persona-music-*.apk

      # Each new versionName becomes a GitHub release that the in-app updater picks up.
      - name: Publish release
        if: env.SIGNED == 'true' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v$VERSION" > /dev/null 2>&1; then
            echo "Release v$VERSION already exists - bump versionName to publish a new one."
          else
            gh release create "v$VERSION" "persona-music-$VERSION.apk" \
              --target "$GITHUB_SHA" \
              --title "Persona Music $VERSION" \
              --notes "$(git log -1 --pretty=%B | sed '/^Co-Authored-By/d;/^Claude-Session/d')"
          fi

      # Mirror the APK to the public releases repo (no source code there).
      - name: Publish to releases repo
        if: env.SIGNED == 'true' && github.event_name != 'pull_request' && env.HAS_RELEASES_TOKEN == 'true'
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          if gh release view "v$VERSION" --repo FSosuke/persona-music-releases > /dev/null 2>&1; then
            echo "v$VERSION already in the releases repo."
          else
            gh release create "v$VERSION" "persona-music-$VERSION.apk" \
              --repo FSosuke/persona-music-releases \
              --title "Persona Music $VERSION" \
              --notes "$(git log -1 --pretty=%B | sed '/^Co-Authored-By/d;/^Claude-Session/d')"
          fi
